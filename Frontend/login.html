
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Bharat Study Buddy</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #f5f3ff, #e8f0ff);
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 12px 40px #24245a18;
        }

        .logo {
            text-align: center;
            font-size: 23px;
            font-weight: bold;
            color: #5145cd;
            margin-bottom: 12px;
        }

        h1 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 8px;
            color: #24213d;
        }

        .subtitle {
            text-align: center;
            color: #77758a;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .tabs {
            display: flex;
            background: #f1efff;
            padding: 5px;
            border-radius: 10px;
            margin-bottom: 24px;
        }

        .tabs button {
            flex: 1;
            border: none;
            padding: 11px;
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
            color: #666;
            font-size: 15px;
        }

        .tabs button.active {
            background: white;
            color: #5145cd;
            font-weight: bold;
            box-shadow: 0 2px 8px #0000000c;
        }

        .field {
            margin-bottom: 17px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
            color: #38364c;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #deddea;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #6b5ce7;
            box-shadow: 0 0 0 3px #6b5ce71a;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background: #5145cd;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .submit-btn:disabled,
        .secondary-btn:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        .secondary-btn {
            width: 100%;
            padding: 11px;
            margin-top: 10px;
            background: white;
            color: #5145cd;
            border: 1px solid #d8d3ff;
            border-radius: 9px;
            font-size: 14px;
            cursor: pointer;
        }

        .message {
            display: none;
            padding: 11px;
            margin-bottom: 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: #fff0f0;
            color: #b42318;
        }

        .message.success {
            background: #eafaf0;
            color: #16723a;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #5145cd;
            text-decoration: none;
            font-size: 14px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <main class="auth-card">
        <div class="logo">📚 Bharat Study Buddy</div>

        <h1 id="heading">Welcome Back!</h1>
        <p class="subtitle" id="subtitle">
            Login to continue your learning journey.
        </p>

        <div class="tabs" id="authTabs">
            <button type="button" id="loginTab" class="active">Login</button>
            <button type="button" id="signupTab">Sign Up</button>
        </div>

        <div id="message" class="message" role="status"
             aria-live="polite"></div>

        <!-- LOGIN FORM -->
        <form id="loginForm">
            <div class="field">
                <label for="loginEmail">Email Address</label>
                <input id="loginEmail" type="email"
                       autocomplete="email" required>
            </div>

            <div class="field">
                <label for="loginPassword">Password</label>
                <input id="loginPassword" type="password"
                       autocomplete="current-password" required>
            </div>

            <button class="submit-btn" type="submit">Login</button>
        </form>

        <!-- SIGNUP FORM -->
        <form id="signupForm" class="hidden">
            <div class="field">
                <label for="signupName">Full Name</label>
                <input id="signupName" type="text"
                       maxlength="100" autocomplete="name" required>
            </div>

            <div class="field">
                <label for="signupEmail">Email Address</label>
                <input id="signupEmail" type="email"
                       autocomplete="email" required>
            </div>

            <div class="field">
                <label for="signupPassword">Create Password</label>
                <input id="signupPassword" type="password"
                       autocomplete="new-password"
                       minlength="8" required>
            </div>

            <button class="submit-btn" type="submit">
                Send Verification Code
            </button>
        </form>

        <!-- OTP VERIFICATION FORM -->
        <form id="otpForm" class="hidden">
            <p id="otpEmailText" class="subtitle"></p>

            <div class="field">
                <label for="otpCode">6-Digit Verification Code</label>
                <input
                    id="otpCode"
                    type="text"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    pattern="[0-9]{6}"
                    maxlength="6"
                    placeholder="Enter 6-digit code"
                    required
                >
            </div>

            <button class="submit-btn" type="submit">
                Verify &amp; Create Account
            </button>

            <button class="secondary-btn" id="resendOtpBtn" type="button">
                Resend Code
            </button>

            <button class="secondary-btn" id="editSignupBtn" type="button">
                Back to Signup Details
            </button>
        </form>

        <a href="index.html" class="back-link">← Back to Home</a>
    </main>

    <script>
        const API_BASE = "http://127.0.0.1:5000";

        const loginTab = document.getElementById("loginTab");
        const signupTab = document.getElementById("signupTab");
        const authTabs = document.getElementById("authTabs");

        const loginForm = document.getElementById("loginForm");
        const signupForm = document.getElementById("signupForm");
        const otpForm = document.getElementById("otpForm");

        const heading = document.getElementById("heading");
        const subtitle = document.getElementById("subtitle");
        const messageBox = document.getElementById("message");

        const otpEmailText = document.getElementById("otpEmailText");
        const otpCode = document.getElementById("otpCode");
        const resendOtpBtn = document.getElementById("resendOtpBtn");
        const editSignupBtn = document.getElementById("editSignupBtn");

        let pendingEmail = "";

        function showMessage(text, type = "error") {
            messageBox.textContent = text;
            messageBox.className = "message show " + type;
        }

        function clearMessage() {
            messageBox.textContent = "";
            messageBox.className = "message";
        }

        function setViewState(view) {
            loginForm.style.display = "";
            signupForm.style.display = "";
            otpForm.style.display = "";
            authTabs.style.display = "";

            if (view === "login") {
                loginForm.classList.remove("hidden");
                signupForm.classList.add("hidden");
                otpForm.classList.add("hidden");
                authTabs.classList.remove("hidden");

                loginTab.classList.add("active");
                signupTab.classList.remove("active");

                heading.textContent = "Welcome Back!";
                subtitle.textContent = "Login to continue your learning journey.";
            } else if (view === "signup") {
                loginForm.classList.add("hidden");
                signupForm.classList.remove("hidden");
                otpForm.classList.add("hidden");
                authTabs.classList.remove("hidden");

                loginTab.classList.remove("active");
                signupTab.classList.add("active");

                heading.textContent = "Create Your Account";
                subtitle.textContent = "Join Bharat Study Buddy and study smarter.";
            } else if (view === "otp") {
                loginForm.classList.add("hidden");
                signupForm.classList.add("hidden");
                otpForm.classList.remove("hidden");
                authTabs.classList.add("hidden");

                heading.textContent = "Verify Your Email";
                subtitle.textContent = "Check your inbox and enter the verification code.";
            }
        }

        function clearPendingOtpSession() {
            sessionStorage.removeItem("studyBuddyPendingEmail");
            sessionStorage.removeItem("studyBuddyPendingName");
            sessionStorage.removeItem("studyBuddyPendingPassword");
            pendingEmail = "";
        }

        function switchTab(mode) {
            clearMessage();
            clearPendingOtpSession();
            setViewState(mode);
        }

        loginTab.addEventListener("click", () => switchTab("login"));
        signupTab.addEventListener("click", () => switchTab("signup"));

        async function sendRequest(endpoint, data) {
            const response = await fetch(API_BASE + endpoint, {
                method: "POST",
                credentials: "include",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            const result = await response.json().catch(() => ({}));

            console.log("API STATUS:", response.status);
            console.log("API RESPONSE:", result);

            if (!response.ok || result.success !== true) {
                throw new Error(result.message || "Something went wrong.");
            }

            return result;
        }

        // LOGIN
        loginForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const button = loginForm.querySelector(".submit-btn");
            button.disabled = true;
            button.textContent = "Logging in...";
            clearMessage();

            try {
                const result = await sendRequest("/api/auth/login", {
                    email: document.getElementById("loginEmail").value.trim(),
                    password: document.getElementById("loginPassword").value
                });

                sessionStorage.setItem(
                    "studyBuddyUser",
                    JSON.stringify(result.user)
                );

                showMessage("Login successful! Opening dashboard...", "success");

                setTimeout(() => {
                    window.location.href = "/dashboard.html";
                }, 700);

            } catch (error) {
                showMessage(error.message);
            } finally {
                button.disabled = false;
                button.textContent = "Login";
            }
        });

        // SEND OTP
        signupForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const nameInput = document.getElementById("signupName");
            const emailInput = document.getElementById("signupEmail");
            const passwordInput = document.getElementById("signupPassword");

            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            const button = signupForm.querySelector(".submit-btn");
            button.disabled = true;
            button.textContent = "Sending code...";
            clearMessage();

            try {
                const result = await sendRequest("/api/auth/send-otp", {
                    name: name,
                    email: email,
                    password: password
                });

                pendingEmail = result.email || email;

                // Persist pending OTP details in sessionStorage to survive any
                // live-server reloads or page refreshes
                sessionStorage.setItem("studyBuddyPendingEmail", pendingEmail);
                sessionStorage.setItem("studyBuddyPendingName", name);
                sessionStorage.setItem("studyBuddyPendingPassword", password);

                setViewState("otp");

                otpEmailText.textContent = "Enter the verification code sent to " + pendingEmail;
                otpCode.value = "";
                showMessage(result.message || "Verification code sent to your email.", "success");
                otpCode.focus();

            } catch (error) {
                showMessage(error.message);
            } finally {
                button.disabled = false;
                button.textContent = "Send Verification Code";
            }
        });

        // VERIFY OTP
        otpForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const emailToVerify = pendingEmail || sessionStorage.getItem("studyBuddyPendingEmail") || document.getElementById("signupEmail").value.trim();

            if (!emailToVerify) {
                showMessage("Email address is missing. Please return to Signup.");
                return;
            }

            const button = otpForm.querySelector(".submit-btn");
            button.disabled = true;
            button.textContent = "Verifying...";
            clearMessage();

            try {
                const result = await sendRequest("/api/auth/verify-otp", {
                    email: emailToVerify,
                    otp: otpCode.value.trim()
                });

                clearPendingOtpSession();
                signupForm.reset();
                otpForm.reset();

                setViewState("login");

                document.getElementById("loginEmail").value = emailToVerify;
                document.getElementById("loginPassword").focus();

                showMessage(
                    result.message || "Account created! Please log in.",
                    "success"
                );

            } catch (error) {
                showMessage(error.message);
            } finally {
                button.disabled = false;
                button.textContent = "Verify & Create Account";
            }
        });

        // RESEND OTP
        resendOtpBtn.addEventListener("click", async () => {
            const email = pendingEmail || sessionStorage.getItem("studyBuddyPendingEmail") || document.getElementById("signupEmail").value.trim();
            const name = document.getElementById("signupName").value.trim() || sessionStorage.getItem("studyBuddyPendingName") || "User";
            const password = document.getElementById("signupPassword").value || sessionStorage.getItem("studyBuddyPendingPassword") || "";

            if (!name || !email || !password) {
                showMessage("Signup details are missing. Please click 'Back to Signup Details' to re-enter them.");
                return;
            }

            resendOtpBtn.disabled = true;
            resendOtpBtn.textContent = "Sending...";
            clearMessage();

            try {
                const result = await sendRequest("/api/auth/send-otp", {
                    name: name,
                    email: email,
                    password: password
                });

                pendingEmail = result.email || email;
                sessionStorage.setItem("studyBuddyPendingEmail", pendingEmail);
                otpEmailText.textContent = "Enter the verification code sent to " + pendingEmail;
                otpCode.value = "";
                showMessage(result.message || "Verification code resent.", "success");
                otpCode.focus();

            } catch (error) {
                showMessage(error.message);
            } finally {
                resendOtpBtn.disabled = false;
                resendOtpBtn.textContent = "Resend Code";
            }
        });

        // EDIT SIGNUP DETAILS
        editSignupBtn.addEventListener("click", () => {
            clearPendingOtpSession();
            setViewState("signup");
            clearMessage();
            document.getElementById("signupEmail").focus();
        });

        // RESTORE STATE ON PAGE LOAD (if pending OTP verification in progress)
        (function initAuthFlow() {
            const savedEmail = sessionStorage.getItem("studyBuddyPendingEmail");
            if (savedEmail) {
                pendingEmail = savedEmail;
                const savedName = sessionStorage.getItem("studyBuddyPendingName");
                const savedPassword = sessionStorage.getItem("studyBuddyPendingPassword");
                if (savedName && !document.getElementById("signupName").value) {
                    document.getElementById("signupName").value = savedName;
                }
                if (savedPassword && !document.getElementById("signupPassword").value) {
                    document.getElementById("signupPassword").value = savedPassword;
                }
                document.getElementById("signupEmail").value = savedEmail;

                setViewState("otp");
                otpEmailText.textContent = "Enter the verification code sent to " + pendingEmail;
                showMessage("Verification code sent to " + pendingEmail + ". Please check your inbox and verify.", "success");
                otpCode.focus();
            } else {
                setViewState("login");
            }
        })();
    </script>
</body>
</html>
