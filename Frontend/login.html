
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Bharat Study Buddy</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #f5f3ff, #e8f0ff);
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 12px 40px #24245a18;
        }

        .logo {
            text-align: center;
            font-size: 23px;
            font-weight: bold;
            color: #5145cd;
            margin-bottom: 12px;
        }

        h1 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 8px;
            color: #24213d;
        }

        .subtitle {
            text-align: center;
            color: #77758a;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .tabs {
            display: flex;
            background: #f1efff;
            padding: 5px;
            border-radius: 10px;
            margin-bottom: 24px;
        }

        .tabs button {
            flex: 1;
            border: none;
            padding: 11px;
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
            color: #666;
            font-size: 15px;
        }

        .tabs button.active {
            background: white;
            color: #5145cd;
            font-weight: bold;
            box-shadow: 0 2px 8px #0000000c;
        }

        .field {
            margin-bottom: 17px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
            color: #38364c;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #deddea;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #6b5ce7;
            box-shadow: 0 0 0 3px #6b5ce71a;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background: #5145cd;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .submit-btn:disabled,
        .secondary-btn:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        .secondary-btn {
            width: 100%;
            padding: 11px;
            margin-top: 10px;
            background: white;
            color: #5145cd;
            border: 1px solid #d8d3ff;
            border-radius: 9px;
            font-size: 14px;
            cursor: pointer;
        }

        .message {
            display: none;
            padding: 11px;
            margin-bottom: 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: #fff0f0;
            color: #b42318;
        }

        .message.success {
            background: #eafaf0;
            color: #16723a;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #5145cd;
            text-decoration: none;
            font-size: 14px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <main class="auth-card">
        <div class="logo">📚 Bharat Study Buddy</div>

        <h1 id="heading">Welcome Back!</h1>
        <p class="subtitle" id="subtitle">
            Login to continue your learning journey.
        </p>

        <div class="tabs" id="authTabs">
            <button type="button" id="loginTab" class="active">Login</button>
            <button type="button" id="signupTab">Sign Up</button>
        </div>

        <div id="message" class="message" role="status"
             aria-live="polite"></div>

        <!-- LOGIN FORM -->
        <form id="loginForm">
            <div class="field">
                <label for="loginEmail">Email Address</label>
                <input id="loginEmail" type="email"
                       autocomplete="email" required>
            </div>

            <div class="field">
                <label for="loginPassword">Password</label>
                <input id="loginPassword" type="password"
                       autocomplete="current-password" required>
            </div>

            <button class="submit-btn" type="submit">Login</button>
        </form>

        <!-- SIGNUP FORM -->
        <form id="signupForm" class="hidden">
            <div class="field">
                <label for="signupName">Full Name</label>
                <input id="signupName" type="text"
                       maxlength="100" autocomplete="name" placeholder="Enter your full name" required>
            </div>

            <div class="field">
                <label for="signupEmail">Email Address</label>
                <input id="signupEmail" type="email"
                       autocomplete="email" placeholder="name@example.com" required>
            </div>

            <div class="field">
                <label for="signupPassword">Create Password</label>
                <input id="signupPassword" type="password"
                       autocomplete="new-password"
                       minlength="8" placeholder="Minimum 8 characters" required>
            </div>

            <button class="submit-btn" type="submit">
                Create Account
            </button>
        </form>

        <a href="index.html" class="back-link">← Back to Home</a>
    </main>

    <script>
        const API_BASE = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")
            ? "http://127.0.0.1:5000"
            : "https://bharat-study-buddy.onrender.com";

        const loginTab = document.getElementById("loginTab");
        const signupTab = document.getElementById("signupTab");
        const authTabs = document.getElementById("authTabs");

        const loginForm = document.getElementById("loginForm");
        const signupForm = document.getElementById("signupForm");

        const heading = document.getElementById("heading");
        const subtitle = document.getElementById("subtitle");
        const messageBox = document.getElementById("message");

        function showMessage(text, type = "error") {
            messageBox.textContent = text;
            messageBox.className = "message show " + type;
        }

        function clearMessage() {
            messageBox.textContent = "";
            messageBox.className = "message";
        }

        function setViewState(view) {
            clearMessage();
            if (view === "signup") {
                loginForm.classList.add("hidden");
                signupForm.classList.remove("hidden");
                loginTab.classList.remove("active");
                signupTab.classList.add("active");
                heading.textContent = "Create Your Account";
                subtitle.textContent = "Join Bharat Study Buddy and study smarter.";
            } else {
                loginForm.classList.remove("hidden");
                signupForm.classList.add("hidden");
                loginTab.classList.add("active");
                signupTab.classList.remove("active");
                heading.textContent = "Welcome Back!";
                subtitle.textContent = "Login to continue your learning journey.";
            }
        }

        loginTab.addEventListener("click", () => setViewState("login"));
        signupTab.addEventListener("click", () => setViewState("signup"));

        async function sendRequest(endpoint, data) {
            let response;
            try {
                response = await fetch(API_BASE + endpoint, {
                    method: "POST",
                    credentials: "include",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });
            } catch (networkErr) {
                console.error("Network error:", networkErr);
                throw new Error("Unable to connect to the server. If this is the first request, the server may be waking up from sleep (Render cold start); please wait a moment and try again.");
            }

            const result = await response.json().catch(() => ({}));

            console.log("API STATUS:", response.status);
            console.log("API RESPONSE:", result);

            if (!response.ok || result.success !== true) {
                const errorMsg = result.message || (
                    response.status === 401 ? "Invalid email or password." :
                    response.status === 503 ? (result.message || "Email verification service is not configured on the server.") :
                    response.status === 502 ? (result.message || "Email delivery failed. Please check your email address.") :
                    response.status === 504 ? (result.message || "Mail server connection timed out. Please try again.") :
                    response.status === 409 ? (result.message || "This email is already registered. Please log in.") :
                    "Request returned status " + response.status
                );
                throw new Error(errorMsg);
            }

            return result;
        }

        // LOGIN
        loginForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const button = loginForm.querySelector(".submit-btn");
            button.disabled = true;
            button.textContent = "Logging in...";
            clearMessage();

            try {
                const result = await sendRequest("/api/auth/login", {
                    email: document.getElementById("loginEmail").value.trim(),
                    password: document.getElementById("loginPassword").value
                });

                sessionStorage.setItem(
                    "studyBuddyUser",
                    JSON.stringify(result.user)
                );

                showMessage("Login successful! Opening dashboard...", "success");

                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 700);

            } catch (error) {
                showMessage(error.message);
            } finally {
                button.disabled = false;
                button.textContent = "Login";
            }
        });

        // SIGNUP
        signupForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const nameInput = document.getElementById("signupName");
            const emailInput = document.getElementById("signupEmail");
            const passwordInput = document.getElementById("signupPassword");

            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!name || !email || !password) {
                showMessage("Please fill in all fields.");
                return;
            }

            if (password.length < 8) {
                showMessage("Password must be at least 8 characters long.");
                return;
            }

            const button = signupForm.querySelector(".submit-btn");
            button.disabled = true;
            button.textContent = "Creating Account...";
            clearMessage();

            try {
                const result = await sendRequest("/api/auth/signup", {
                    name: name,
                    email: email,
                    password: password
                });

                if (result.user) {
                    sessionStorage.setItem(
                        "studyBuddyUser",
                        JSON.stringify(result.user)
                    );
                }

                showMessage(result.message || "Account created successfully! Opening dashboard...", "success");

                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 700);

            } catch (error) {
                showMessage(error.message);
            } finally {
                button.disabled = false;
                button.textContent = "Create Account";
            }
        });

        // RESTORE STATE ON PAGE LOAD
        (function initAuthFlow() {
            sessionStorage.removeItem("studyBuddyPendingEmail");
            sessionStorage.removeItem("studyBuddyPendingName");
            sessionStorage.removeItem("studyBuddyPendingPassword");

            if (window.location.hash === "#signup") {
                setViewState("signup");
            } else {
                setViewState("login");
            }
        })();
    </script>
</body>
</html>
